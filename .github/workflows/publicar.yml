name: Probar y publicar para Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar, por ejemplo v0.1.2. Vacío: solo prueba y arma el paquete."
        required: false
        default: ""

jobs:
  probar-y-armar:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pruebas
        run: python -m unittest discover -s tests
      - name: Armar el paquete
        run: python armar_paquete_windows.py
      - name: Abrir el paquete en Windows
        run: python tests/humo_windows.py "dist/Club Carniceria Joaquin.zip"
      - name: Armar el paquete para Windows 7
        run: python armar_paquete_windows.py --windows7
      - name: Abrir el paquete para Windows 7 (con su Python 3.8)
        run: python tests/humo_windows.py "dist/Club Carniceria Joaquin (Windows 7).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: paquete
          path: |
            dist/Club Carniceria Joaquin.zip
            dist/Club Carniceria Joaquin (Windows 7).zip
          if-no-files-found: error

  publicar:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.version, 'v') && github.ref == 'refs/heads/main')
    needs: probar-y-armar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquete
      - name: Crear la versión
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          mv "Club Carniceria Joaquin.zip" ClubCarniceriaJoaquin.zip
          mv "Club Carniceria Joaquin (Windows 7).zip" ClubCarniceriaJoaquin-Windows7.zip
          gh release create "$VERSION" ClubCarniceriaJoaquin.zip ClubCarniceriaJoaquin-Windows7.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Club Carnicería Joaquín $VERSION" \
            --notes "Para Windows 10 u 11 de 64 bits: ClubCarniceriaJoaquin.zip. Para Windows 7 SP1 de 64 bits: ClubCarniceriaJoaquin-Windows7.zip. No hace falta instalar Python. Descargá el que corresponda, extraelo en una carpeta propia, como C:\\Club Carniceria Joaquin, y seguí los pasos de LEEME.txt. Al actualizar, conservá la carpeta datos."
